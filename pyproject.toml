[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codebook-pre-commit"
version = "0.3.42.post1"
description = "Pre-commit adapter for official Codebook binaries"
requires-python = ">=3.10"

[project.scripts]
codebook-pre-commit = "codebook_pre_commit:main"

[tool.setuptools]
py-modules = ["codebook_pre_commit"]
